name: Oppdater kinoprogram

on:
  schedule:
    # Tre ganger i døgnet. NFkino publiserer nytt program tirsdag ettermiddag.
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    paths:
      - scrape.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: oppdater-program
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Hent program fra nfkino.no
        run: python3 scrape.py --out program.json

      - name: Sammendrag
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, time
          d = json.load(open("program.json"))
          print("### Kinoprogram oppdatert\n")
          print("- Filmlenker funnet: %d%s" % (d.get("linksFound", 0),
                "  :warning: **KUTTET**" if d.get("truncated") else ""))
          print("- Filmer med visninger: **%d**" % len(d["films"]))
          print("- Visninger: **%d**" % len(d["screenings"]))
          print("- Kinoer: %s" % ", ".join(c["name"] for c in d["cinemas"]))
          print("- Hentet: %s UTC" % time.strftime("%Y-%m-%d %H:%M", time.gmtime(d["generated"])))
          PY

      - name: Commit hvis endret
        run: |
          git config user.name "nfkino-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program.json
          if git diff --quiet --cached; then
            echo "Ingen endringer i programmet."
          else
            git commit -m "Oppdater kinoprogram"
            git push
          fi
